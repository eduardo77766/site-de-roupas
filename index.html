<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOIRFIT • Promoções Dark Academia</title>
<style>
  /* ========== RESET & VARIÁVEIS ========== */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    --bg-primary: #0a0a0a;
    --bg-secondary: #111111;
    --bg-card: #161616;
    --bg-hover: #1e1e1e;
    --accent: #a855f7;
    --accent-dark: #7c3aed;
    --accent-glow: rgba(168, 85, 247, 0.3);
    --text-primary: #f0f0f0;
    --text-secondary: #888888;
    --text-muted: #555555;
    --border: #222222;
    --border-accent: rgba(168, 85, 247, 0.4);
    --danger: #ef4444;
    --success: #22c55e;
    --font-display: 'Georgia', 'Times New Roman', serif;
    --font-body: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }

  body {
    background-color: var(--bg-primary);
    color: var(--text-primary);
    font-family: var(--font-body);
    line-height: 1.6;
    overflow-x: hidden;
  }

  /* ========== SCROLLBAR ========== */
  ::-webkit-scrollbar {
    width: 8px;
  }
  ::-webkit-scrollbar-track {
    background: var(--bg-secondary);
  }
  ::-webkit-scrollbar-thumb {
    background: var(--accent-dark);
    border-radius: 4px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: var(--accent);
  }

  /* ========== ANIMAÇÕES ========== */
  @keyframes glowPulse {
    0%, 100% { box-shadow: 0 0 20px var(--accent-glow), 0 0 40px transparent; }
    50% { box-shadow: 0 0 30px var(--accent-glow), 0 0 60px var(--accent-glow); }
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes slideInLeft {
    from { opacity: 0; transform: translateX(-40px); }
    to { opacity: 1; transform: translateX(0); }
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  @keyframes shimmer {
    0% { background-position: -200% center; }
    100% { background-position: 200% center; }
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* ========== HEADER / NAVBAR ========== */
  .navbar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 1000;
    background: rgba(10, 10, 10, 0.92);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: all 0.3s ease;
  }

  .navbar.scrolled {
    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.6);
  }

  .navbar-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: var(--text-primary);
  }

  .navbar-brand .logo-icon {
    font-size: 28px;
    animation: float 3s ease-in-out infinite;
  }

  .navbar-brand .logo-text {
    font-family: var(--font-display);
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    background: linear-gradient(135deg, var(--text-primary), var(--accent), var(--text-primary));
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shimmer 4s linear infinite;
  }

  .navbar-links {
    display: flex;
    gap: 8px;
    list-style: none;
  }

  .navbar-links a {
    text-decoration: none;
    color: var(--text-secondary);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 8px 16px;
    border-radius: 8px;
    transition: all 0.3s ease;
    position: relative;
  }

  .navbar-links a:hover,
  .navbar-links a.active {
    color: var(--accent);
    background: rgba(168, 85, 247, 0.08);
  }

  .navbar-links a::after {
    content: '';
    position: absolute;
    bottom: 2px;
    left: 50%;
    transform: translateX(-50%) scaleX(0);
    width: 20px;
    height: 2px;
    background: var(--accent);
    transition: transform 0.3s ease;
    border-radius: 1px;
  }

  .navbar-links a:hover::after {
    transform: translateX(-50%) scaleX(1);
  }

  .navbar-actions {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .search-box {
    display: flex;
    align-items: center;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0 12px;
    height: 40px;
    transition: all 0.3s ease;
  }

  .search-box:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  .search-box input {
    background: none;
    border: none;
    outline: none;
    color: var(--text-primary);
    font-size: 13px;
    padding: 0 8px;
    width: 180px;
    font-family: var(--font-body);
  }

  .search-box input::placeholder {
    color: var(--text-muted);
  }

  .search-box .search-icon {
    color: var(--text-muted);
    font-size: 16px;
  }

  .cart-btn {
    position: relative;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 10px;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.3s ease;
    color: var(--text-primary);
    font-size: 18px;
  }

  .cart-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .cart-count {
    position: absolute;
    top: -6px;
    right: -6px;
    background: var(--accent);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid var(--bg-primary);
  }

  .mobile-menu-btn {
    display: none;
    background: none;
    border: none;
    color: var(--text-primary);
    font-size: 24px;
    cursor: pointer;
  }

  /* ========== HERO SECTION ========== */
  .hero {
    margin-top: 70px;
    position: relative;
    min-height: 520px;
    display: flex;
    align-items: center;
    overflow: hidden;
    background: linear-gradient(135deg, #0a0a0a 0%, #1a0a2e 50%, #0a0a0a 100%);
  }

  .hero::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background:
      radial-gradient(ellipse at 20% 50%, rgba(168, 85, 247, 0.08) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 30%, rgba(124, 58, 237, 0.06) 0%, transparent 50%);
    pointer-events: none;
  }

  .hero::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23a855f7' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    pointer-events: none;
  }

  .hero-content {
    position: relative;
    z-index: 2;
    max-width: 1200px;
    margin: 0 auto;
    padding: 60px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    gap: 40px;
  }

  .hero-text {
    flex: 1;
    animation: slideInLeft 0.8s ease-out;
  }

  .hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(168, 85, 247, 0.12);
    border: 1px solid var(--border-accent);
    color: var(--accent);
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 20px;
  }

  .hero-badge .pulse-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    animation: glowPulse 2s infinite;
  }

  .hero-title {
    font-family: var(--font-display);
    font-size: clamp(36px, 5vw, 60px);
    font-weight: 700;
    line-height: 1.1;
    margin-bottom: 16px;
    letter-spacing: -1px;
  }

  .hero-title .highlight {
    color: var(--accent);
    position: relative;
  }

  .hero-subtitle {
    font-size: clamp(15px, 2vw, 18px);
    color: var(--text-secondary);
    max-width: 480px;
    margin-bottom: 32px;
    line-height: 1.7;
  }

  .hero-cta {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 14px 32px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.3s ease;
    font-family: var(--font-body);
    text-decoration: none;
    position: relative;
    overflow: hidden;
  }

  .btn-primary::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
    transition: left 0.5s ease;
  }

  .btn-primary:hover::before {
    left: 100%;
  }

  .btn-primary:hover {
    background: var(--accent-dark);
    transform: translateY(-2px);
    box-shadow: 0 8px 30px var(--accent-glow);
  }

  .btn-outline {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: transparent;
    color: var(--text-primary);
    border: 1px solid var(--border);
    padding: 14px 32px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.3s ease;
    font-family: var(--font-body);
    text-decoration: none;
  }

  .btn-outline:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(168, 85, 247, 0.06);
    transform: translateY(-2px);
  }

  .hero-visual {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    animation: fadeInUp 0.8s ease-out 0.2s both;
  }

  .hero-card-float {
    background: var(--bg-card);
    border: 1px solid var(--border-accent);
    border-radius: 20px;
    padding: 28px;
    width: 300px;
    animation: float 4s ease-in-out infinite;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 40px var(--accent-glow);
    position: relative;
  }

  .hero-card-float::before {
    content: '🔥 OFERTA RELÂMPAGO';
    position: absolute;
    top: -12px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--danger);
    color: #fff;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 1.5px;
    padding: 4px 16px;
    border-radius: 12px;
    white-space: nowrap;
  }

  .hero-card-float .float-img {
    width: 100%;
    height: 180px;
    background: linear-gradient(135deg, #1a1a2e, #2d1b4e);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 60px;
    margin-bottom: 16px;
  }

  .hero-card-float .float-name {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .hero-card-float .float-price {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .float-price .old {
    color: var(--text-muted);
    text-decoration: line-through;
    font-size: 13px;
  }

  .float-price .new {
    color: var(--accent);
    font-size: 22px;
    font-weight: 800;
  }

  .float-price .discount-tag {
    background: rgba(34, 197, 94, 0.15);
    color: var(--success);
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 700;
  }

  /* ========== PROMO BANNER ========== */
  .promo-banner {
    background: linear-gradient(90deg, var(--accent-dark), var(--accent), var(--accent-dark));
    background-size: 200% auto;
    animation: shimmer 3s linear infinite;
    padding: 12px 0;
    overflow: hidden;
    white-space: nowrap;
  }

  .promo-banner-content {
    display: inline-block;
    animation: scrollBanner 25s linear infinite;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #fff;
  }

  @keyframes scrollBanner {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }

  /* ========== FILTROS ========== */
  .filters-section {
    max-width: 1200px;
    margin: 40px auto 0;
    padding: 0 24px;
  }

  .filters-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 16px;
  }

  .filters-title {
    font-family: var(--font-display);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text-secondary);
  }

  .filter-chips {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .filter-chip {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    padding: 8px 18px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: all 0.3s ease;
    font-family: var(--font-body);
    white-space: nowrap;
  }

  .filter-chip:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .filter-chip.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  /* ========== PRODUCT GRID ========== */
  .products-section {
    max-width: 1200px;
    margin: 0 auto;
    padding: 30px 24px 60px;
  }

  .products-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    flex-wrap: wrap;
    gap: 12px;
  }

  .section-title {
    font-family: var(--font-display);
    font-size: clamp(22px, 3vw, 30px);
    font-weight: 700;
    letter-spacing: 1px;
  }

  .section-title .accent {
    color: var(--accent);
  }

  .sort-select {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    color: var(--text-primary);
    padding: 8px 16px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    font-family: var(--font-body);
    outline: none;
    transition: border-color 0.3s;
  }

  .sort-select:focus {
    border-color: var(--accent);
  }

  .product-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 20px;
  }

  .product-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    cursor: pointer;
    position: relative;
    animation: fadeInUp 0.5s ease-out both;
  }

  .product-card:nth-child(1) { animation-delay: 0.05s; }
  .product-card:nth-child(2) { animation-delay: 0.1s; }
  .product-card:nth-child(3) { animation-delay: 0.15s; }
  .product-card:nth-child(4) { animation-delay: 0.2s; }
  .product-card:nth-child(5) { animation-delay: 0.25s; }
  .product-card:nth-child(6) { animation-delay: 0.3s; }
  .product-card:nth-child(7) { animation-delay: 0.35s; }
  .product-card:nth-child(8) { animation-delay: 0.4s; }

  .product-card:hover {
    border-color: var(--border-accent);
    transform: translateY(-6px);
    box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 30px var(--accent-glow);
  }

  .product-badge {
    position: absolute;
    top: 12px;
    left: 12px;
    z-index: 3;
    padding: 4px 12px;
    border-radius: 8px;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .product-badge.hot {
    background: var(--danger);
    color: #fff;
    animation: glowPulse 2s infinite;
  }

  .product-badge.new {
    background: var(--accent);
    color: #fff;
  }

  .product-badge.sold {
    background: rgba(255,255,255,0.1);
    color: var(--text-secondary);
    backdrop-filter: blur(8px);
  }

  .product-img-container {
    position: relative;
    height: 260px;
    background: linear-gradient(145deg, #1a1a2e, #2d1b4e, #1a1a2e);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .product-img-container::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 60px;
    background: linear-gradient(transparent, var(--bg-card));
    pointer-events: none;
  }

  .product-emoji {
    font-size: 80px;
    transition: transform 0.4s ease;
    filter: drop-shadow(0 4px 20px rgba(168, 85, 247, 0.3));
  }

  .product-card:hover .product-emoji {
    transform: scale(1.15) rotate(-5deg);
  }

  .wishlist-btn {
    position: absolute;
    top: 12px;
    right: 12px;
    z-index: 3;
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 50%;
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.3s ease;
    color: var(--text-secondary);
    font-size: 16px;
  }

  .wishlist-btn:hover,
  .wishlist-btn.liked {
    color: var(--danger);
    border-color: var(--danger);
    background: rgba(239, 68, 68, 0.15);
  }

  .product-info {
    padding: 16px;
  }

  .product-name {
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    letter-spacing: 0.3px;
  }

  .product-rating {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-bottom: 10px;
    font-size: 11px;
    color: var(--text-secondary);
  }

  .product-rating .stars {
    color: #f59e0b;
    letter-spacing: -1px;
  }

  .product-price-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
  }

  .product-price {
    font-size: 20px;
    font-weight: 800;
    color: var(--accent);
  }

  .product-old-price {
    font-size: 12px;
    color: var(--text-muted);
    text-decoration: line-through;
  }

  .product-discount {
    background: rgba(34, 197, 94, 0.12);
    color: var(--success);
    font-size: 10px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 4px;
  }

  .product-sold-info {
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 12px;
  }

  .product-btn {
    width: 100%;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    color: var(--text-primary);
    padding: 10px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.3s ease;
    font-family: var(--font-body);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .product-btn:hover {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 4px 20px var(--accent-glow);
  }

  /* ========== COUNTDOWN ========== */
  .countdown-section {
    max-width: 1200px;
    margin: 0 auto 40px;
    padding: 0 24px;
  }

  .countdown-card {
    background: linear-gradient(135deg, var(--bg-card), #1a0a2e);
    border: 1px solid var(--border-accent);
    border-radius: 20px;
    padding: 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 24px;
    position: relative;
    overflow: hidden;
  }

  .countdown-card::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(168,85,247,0.05) 0%, transparent 60%);
    animation: spin 20s linear infinite;
    pointer-events: none;
